<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeRoute — Login</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
</head>
<body>
<div id="nav-placeholder"></div>
<main class="section">
  <div class="container" style="max-width:420px">
    <p class="eyebrow">AUTHENTICATION</p>
    <h2 id="authTitle">Welcome back.</h2>
    <div class="card" style="margin-top:24px">
      <form id="authForm">
        <div class="form-group" id="authNameGroup" hidden><label class="form-label" for="authName">Name</label><input class="input" id="authName" type="text" autocomplete="name" placeholder="Your name"></div>
        <div class="form-group"><label class="form-label" for="authEmail">Email</label><input class="input" id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required></div>
        <div class="form-group"><label class="form-label" for="authPassword">Password</label><input class="input" id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required></div>
        <button class="btn btn-primary" id="authSubmit" type="submit" style="width:100%">Sign In</button>
      </form>
      <p class="muted" style="margin-top:12px;text-align:center"><span id="authSwitchText">No account?</span> <a href="#" id="authSwitch" style="color:var(--caution)">Sign up</a></p>
      <p class="muted" id="authNotice" style="font-size:12px;margin-top:12px" hidden></p>
    </div>
  </div>
</main>
<div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script>
let authMode=new URLSearchParams(location.search).get('mode')==='signup'?'signup':'login';
const redirectTarget=new URLSearchParams(location.search).get('redirect')==='report'?'report.html':'../index.html';
function setAuthMode(mode){
  authMode=mode;
  const signup=mode==='signup';
  document.getElementById('authTitle').textContent=signup?'Create your account.':'Welcome back.';
  document.getElementById('authNameGroup').hidden=!signup;
  document.getElementById('authName').required=signup;
  document.getElementById('authSubmit').textContent=signup?'Create Account':'Sign In';
  document.getElementById('authPassword').autocomplete=signup?'new-password':'current-password';
  document.getElementById('authSwitchText').textContent=signup?'Already have an account?':'No account?';
  document.getElementById('authSwitch').textContent=signup?'Sign in':'Sign up';
  document.getElementById('authNotice').hidden=true;
  const params=new URLSearchParams(location.search);params.set('mode',mode);
  history.replaceState(null,'',`${location.pathname}?${params.toString()}`);
}
document.getElementById('authSwitch').addEventListener('click',event=>{
  event.preventDefault();setAuthMode(authMode==='signup'?'login':'signup');
});
document.getElementById('authForm').addEventListener('submit',async event=>{
  event.preventDefault();
  const button=document.getElementById('authSubmit');
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const name=document.getElementById('authName').value.trim();
  if(!SR.supabase||SR.useMock){
    SR.toast('Authentication is unavailable in demo mode. Connect Supabase to enable accounts.','error');
    return;
  }
  button.disabled=true;
  try{
    const result=authMode==='signup'
      ?await SR.supabase.auth.signUp({email,password,options:{data:{name}}})
      :await SR.supabase.auth.signInWithPassword({email,password});
    if(result.error)throw result.error;
    if(authMode==='signup'&&!result.data?.session){
      setAuthMode('login');
      const notice=document.getElementById('authNotice');
      notice.textContent='Account created. Check your email to confirm the account, then sign in.';
      notice.hidden=false;
      SR.toast('Check your email to confirm your account','success');
      return;
    }
    SR.toast(authMode==='signup'?'Account created':'Signed in','success');
    location.href=redirectTarget;
  }catch(error){
    console.error('Authentication failed:',error);
    SR.toast(error.message||'Authentication failed','error');
  }finally{
    button.disabled=false;
  }
});
SR.injectLayout('Home');
setAuthMode(authMode);
</script>
</body>
</html>
