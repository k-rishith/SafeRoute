<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeRoute — Report Hazard</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
</head>
<body>
<div id="nav-placeholder"></div>
<main class="section">
  <div class="container" style="max-width:820px">
    <p class="eyebrow">REPORT A HAZARD</p>
    <h2>Make the road visible.</h2>
    <div id="steps" style="margin:32px 0"></div>
    <div id="stepContent"></div>
  </div>
</main>
<div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script>
let step=1;
let data={category:'Pothole',photo:null,photoPreview:'',lat:null,lng:null,desc:'',severity:'Medium',aiConfirmed:false,submitAsVerified:false};
const categories=['Pothole','Waterlogging','Broken Streetlight','Road Damage','Blocked Footpath','Open Manhole','Other'];
function renderSteps(){
  const names=['Category','Photo & AI','Location','Description','Review'];
  document.getElementById('steps').innerHTML=names.map((n,i)=>`<span style="display:inline-block;margin:0 14px 8px 0;font-weight:700;color:${i+1===step?'var(--caution)':'var(--text-muted)'}">${i+1}. ${n}</span>`).join('');
}
function categoryButtons(){
  return `<div class="ai-category-options" aria-label="Choose hazard category">${categories.map(c=>`<button type="button" class="ai-category-option ${data.category===c?'active':''}" aria-pressed="${data.category===c}" onclick="selectCategory('${c}')">${c}</button>`).join('')}</div>`;
}
function selectCategory(category){
  data.category=category;
  data.aiConfirmed=false;
  if(step===1) step=2;
  render();
}
function renderAI(){
  if(!data.photo) return '<p class="muted" style="margin-top:12px">Upload a photograph to preview the image and review the hazard category.</p>';
  if(data.aiConfirmed){
    return `<div class="card ai-card ai-confirmed" style="margin-top:16px">
      <p class="eyebrow" style="color:var(--safe)">✓ SUGGESTION SUBMITTED</p>
      <h4>${data.category}</h4>
      <p class="muted" style="margin-top:6px">Your category selection is saved in this report draft.</p>
      <button type="button" class="btn btn-secondary" style="margin-top:12px;padding:7px 12px;font-size:12px" onclick="changeSuggestion()">Change Suggestion</button>
    </div>`;
  }
  return `<div class="card ai-card" style="margin-top:16px">
    <p class="eyebrow" style="color:var(--ai)">AI ROAD ANALYSIS · DEMO SUGGESTION</p>
    <h4 style="margin:8px 0">Suggested category: ${data.category}</h4>
    <p class="muted">This is a demonstration suggestion, not a verified model prediction. Select the category that best describes the image.</p>
    ${categoryButtons()}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
      <button type="button" class="btn btn-primary" onclick="confirmSuggestion()">Confirm Suggestion</button>
      <button type="button" class="btn btn-secondary" onclick="resetSuggestion()">Reset Selection</button>
    </div>
  </div>`;
}
function confirmSuggestion(){data.aiConfirmed=true;render();SR.toast('Suggestion submitted to your report draft','success');}
function changeSuggestion(){data.aiConfirmed=false;render();}
function resetSuggestion(){data.category='Pothole';data.aiConfirmed=false;render();}
function handlePhoto(input){
  const file=input.files?.[0]; if(!file)return;
  if(!file.type.startsWith('image/')){SR.toast('Please choose an image file','error');input.value='';return;}
  if(file.size>8*1024*1024){SR.toast('Image must be smaller than 8 MB','error');input.value='';return;}
  data.photo=file;
  const reader=new FileReader();
  reader.onload=()=>{data.photoPreview=reader.result;renderPhotoPreview();};
  reader.readAsDataURL(file);
}
function renderPhotoPreview(){
  const slot=document.getElementById('photoPreviewSlot');
  if(slot&&data.photoPreview) slot.innerHTML=`<img class="photo-preview" src="${data.photoPreview}" alt="Selected road hazard photo">`;
  const ai=document.getElementById('aiSuggest');if(ai)ai.innerHTML=renderAI();
}
function render(){
  renderSteps();
  const c=document.getElementById('stepContent');
  if(step===1){
    c.innerHTML=`<div class="card"><h4>Select the hazard category</h4><p class="muted" style="margin:8px 0 18px">Choose the closest match. You can revise it after uploading a photograph.</p>${categoryButtons()}<div style="margin-top:20px"><button class="btn btn-primary" onclick="step=2;render()">Continue to Photo →</button></div></div>`;
  }else if(step===2){
    c.innerHTML=`<div class="card"><h4>Upload hazard photograph</h4><p class="muted" style="margin:8px 0 16px">Only upload a photograph when you are safely stopped. Never photograph hazards while driving.</p><input type="file" accept="image/jpeg,image/png,image/webp" class="input" onchange="handlePhoto(this)"><div id="photoPreviewSlot">${data.photoPreview?`<img class="photo-preview" src="${data.photoPreview}" alt="Selected hazard image">`:''}</div><div id="aiSuggest" style="margin-top:16px">${renderAI()}</div><div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" onclick="step=1;render()">Back</button><button class="btn btn-primary" onclick="step=3;render()">Continue to Location →</button></div></div>`;
  }else if(step===3){
    c.innerHTML=`<div class="card"><h4>Confirm the hazard location</h4><p class="muted" style="margin:8px 0 16px">Default demo area: Hyderabad, Telangana. You can use GPS or enter coordinates.</p><div class="form-group"><label class="form-label">Latitude</label><input id="latInput" class="input" type="number" step="any" value="${data.lat??17.3850}"></div><div class="form-group"><label class="form-label">Longitude</label><input id="lngInput" class="input" type="number" step="any" value="${data.lng??78.4867}"></div><button class="btn btn-secondary" type="button" onclick="captureGPS()">◎ Use My Location</button><div style="margin-top:18px;display:flex;gap:8px"><button class="btn btn-secondary" onclick="step=2;render()">Back</button><button class="btn btn-primary" onclick="saveLocationAndContinue()">Continue →</button></div></div>`;
  }else if(step===4){
    c.innerHTML=`<div class="card"><div class="form-group"><label class="form-label">Description</label><textarea id="descriptionInput" class="textarea" placeholder="Describe what road users should know...">${data.desc}</textarea></div><div class="form-group"><label class="form-label">Severity</label><select id="severityInput" class="select">${['Low','Medium','High','Critical'].map(s=>`<option ${s===data.severity?'selected':''}>${s}</option>`).join('')}</select></div><div style="display:flex;gap:8px"><button class="btn btn-secondary" onclick="step=3;render()">Back</button><button class="btn btn-primary" onclick="saveDescriptionAndReview()">Review Report →</button></div></div>`;
  }else if(step===5){
    c.innerHTML=`<div class="card"><h4>Review your report</h4><p><strong>Category:</strong> ${data.category}</p><p><strong>Severity:</strong> ${data.severity}</p><p><strong>Description:</strong> ${data.desc||'—'}</p><p class="muted">Location: ${Number(data.lat).toFixed(5)}, ${Number(data.lng).toFixed(5)}</p>${data.photoPreview?`<img class="photo-preview" src="${data.photoPreview}" alt="Report evidence">`:''}<p class="muted" style="font-size:12px;margin-top:12px">${data.aiConfirmed?'Category suggestion confirmed.':'Category selected manually.'}</p>
      <label class="verified-report-option"><input id="verifiedUserToggle" type="checkbox" ${data.submitAsVerified?'checked':''} onchange="toggleVerifiedUser(this.checked)"><span><strong>Submit as a verified user</strong><small>Sign in or create an account to submit this report as an authenticated user.</small></span></label>
      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" onclick="step=4;render()">Back</button><button class="btn btn-primary" onclick="submitReport()">Submit Report</button></div></div>`;
  }
}
function showVerifiedAccountModal(){
  const modal=SR.modal(`<div class="modal-header"><h3>Login or Sign Up</h3><button class="modal-close" type="button" aria-label="Close">×</button></div>
    <p class="muted">To submit this report as a verified user, sign in to your SafeRoute account or create one. The account page opens in a new tab so this report draft stays open.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:20px">
      <a class="btn btn-primary" href="login.html?mode=login" target="_blank" rel="noopener">Login</a>
      <a class="btn btn-secondary" href="login.html?mode=signup" target="_blank" rel="noopener">Sign Up</a>
      <button class="btn btn-ghost" type="button" data-continue-guest>Continue as guest</button>
    </div>`);
  modal.querySelector('[data-continue-guest]').addEventListener('click',()=>{
    data.submitAsVerified=false;
    const toggle=document.getElementById('verifiedUserToggle');if(toggle)toggle.checked=false;
    modal.remove();
  });
}
function toggleVerifiedUser(enabled){
  data.submitAsVerified=Boolean(enabled);
  if(data.submitAsVerified)showVerifiedAccountModal();
}


function captureGPS(){
  if(!navigator.geolocation){SR.toast('Geolocation is not supported in this browser','error');return;}
  SR.toast('Requesting current location…','info');
  navigator.geolocation.getCurrentPosition(pos=>{
    data.lat=pos.coords.latitude;data.lng=pos.coords.longitude;
    document.getElementById('latInput').value=data.lat;document.getElementById('lngInput').value=data.lng;
    SR.toast('Location captured','success');
  },()=>SR.toast('Location permission denied. Enter coordinates manually.','error'),{enableHighAccuracy:true,timeout:10000});
}
function saveLocationAndContinue(){
  data.lat=Number(document.getElementById('latInput').value);data.lng=Number(document.getElementById('lngInput').value);
  if(!Number.isFinite(data.lat)||!Number.isFinite(data.lng)||Math.abs(data.lat)>90||Math.abs(data.lng)>180){SR.toast('Enter valid latitude and longitude','error');return;}
  step=4;render();
}
function saveDescriptionAndReview(){data.desc=document.getElementById('descriptionInput').value.trim();data.severity=document.getElementById('severityInput').value;if(!data.desc){SR.toast('Add a short description before continuing','error');return;}step=5;render();}
async function submitReport(){
  if(data.submitAsVerified){
    let signedInUser=null;
    if(SR.supabase&&!SR.useMock){
      try{const userResult=await SR.supabase.auth.getUser();signedInUser=userResult.data?.user||null;}catch(error){console.error(error);}
    }
    if(!signedInUser){showVerifiedAccountModal();SR.toast('Login or sign up to submit as a verified user','info');return;}
  }
  const button=document.querySelector('#stepContent .btn-primary');if(button)button.disabled=true;
  const created=await SR.api.createHazard({category:data.category,severity:data.severity,description:data.desc,lat:data.lat,lng:data.lng});
  if(!created){if(button)button.disabled=false;return;}
  if(data.photo){await SR.api.uploadEvidence(created.id,data.photo,'evidence');}
  SR.toast('Report submitted','success');
  setTimeout(()=>location.href='map.html',900);
}
render();
SR.injectLayout('Report Hazard');
</script>
</body>
</html>
